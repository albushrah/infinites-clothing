<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access | NOIRFRAME</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --black: #050505; --white: #ffffff; --gold: #cba052; --gray: #151515; --border: #333; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--black); color: var(--white); font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }

        .login-box { background-color: var(--gray); padding: 50px 40px; border-radius: 8px; border-top: 3px solid var(--gold); width: 100%; max-width: 400px; text-align: center; }
        .login-box h1 { font-size: 1.5rem; margin-bottom: 10px; letter-spacing: 2px; }
        .login-box p { color: #888; font-size: 12px; margin-bottom: 30px; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 8px; text-transform: uppercase; }
        .form-group input { width: 100%; padding: 15px; background: #050505; border: 1px solid var(--border); color: white; border-radius: 4px; font-family: 'Montserrat', sans-serif; }
        .form-group input:focus { outline: none; border-color: var(--gold); }

        .submit-btn { width: 100%; padding: 15px; background: var(--gold); color: var(--black); border: none; font-size: 14px; font-weight: 800; letter-spacing: 2px; cursor: pointer; transition: 0.3s; border-radius: 4px; }
        .submit-btn:hover { background: var(--white); }
                /* --- MOBILE FIX FOR ADMIN LOGIN --- */
        @media (max-width: 768px) {
            .login-box {
                width: 90% !important; /* Gives it space on the sides */
                padding: 40px 20px !important; /* Adjusts inner spacing */
            }
            .login-box h1 {
                font-size: 1.2rem !important;
            }
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>RESTRICTED ACCESS</h1>
        <p>Enter Admin Credentials</p>
        
        <form onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label>Admin Password</label>
                <input type="password" id="admin-password" required>
            </div>
            <button type="submit" class="submit-btn">LOGIN</button>
        </form>
    </div>

    <script>
        function handleAdminLogin(e) {
            e.preventDefault();
            const password = document.getElementById('admin-password').value;

            // The secret password is now correctly set
            if (password === 'f@h!zmueeb2268') {
                localStorage.setItem('noirframe_admin', 'true');
                window.location.href = 'admin.html';
            } else {
                alert('ACCESS DENIED: Incorrect Password');
            }
        }
    </script>
</body>
</html>
