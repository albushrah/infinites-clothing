<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | NOIRFRAME</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root { --black: #050505; --white: #ffffff; --bone: #e8e4d9; --gold: #cba052; --gray: #151515; --border: #333; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--black); color: var(--white); font-family: 'Montserrat', sans-serif; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 30px 60px; border-bottom: 1px solid var(--border); }
        .logo-text { font-size: 28px; font-weight: 800; letter-spacing: 8px; color: var(--bone); text-decoration: none; }
        .nav-links a { color: var(--bone); text-decoration: none; margin-left: 40px; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }

        .checkout-container { display: flex; max-width: 1200px; margin: 60px auto; padding: 0 20px; gap: 60px; }
        
        .checkout-form { flex: 2; }
        .checkout-form h2 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .form-group input { width: 100%; padding: 15px; background: var(--gray); border: 1px solid var(--border); color: var(--white); border-radius: 4px; font-family: 'Montserrat', sans-serif; }
        .form-group input:focus { outline: none; border-color: var(--gold); }
        
        .checkout-summary { flex: 1; background: var(--gray); padding: 30px; border-radius: 4px; height: fit-content; border-top: 2px solid var(--gold); }
        .checkout-summary h3 { font-size: 1.2rem; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 0.9rem; color: #ccc; }
        .summary-total { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); font-weight: 800; font-size: 1.2rem; color: var(--gold); }
        
        .pay-btn { width: 100%; padding: 20px; background: var(--gold); color: var(--black); border: none; font-size: 14px; font-weight: 800; letter-spacing: 2px; cursor: pointer; transition: 0.3s; border-radius: 4px; margin-top: 30px; }
        .pay-btn:hover { background: var(--bone); }
                /* --- MOBILE RESPONSIVENESS FOR CHECKOUT --- */
        @media (max-width: 768px) {
            nav { 
                padding: 20px; 
                flex-direction: column; 
                gap: 15px; 
            }
            .nav-links a { 
                margin: 0; 
                font-size: 12px; 
            }
            .checkout-container { 
                flex-direction: column; 
                margin: 30px auto; 
                gap: 30px; 
                padding: 0 15px;
            }
            .checkout-summary {
                width: 100%;
                padding: 20px;
            }
            .checkout-form h2 {
                font-size: 1.5rem;
            }
            .form-group input {
                padding: 12px;
                font-size: 14px;
            }
            .pay-btn {
                padding: 15px;
                font-size: 13px;
            }
        }
                /* --- TABLET VIEW FOR CHECKOUT --- */
        @media (min-width: 769px) and (max-width: 1024px) {
            .checkout-container { flex-direction: column; gap: 40px; }
            .checkout-summary { width: 100%; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo-text">NOIRFRAME</a>
        <div class="nav-links">
            <a href="cart.html">Back to Cart</a>
        </div>
    </nav>

    <div class="checkout-container">
        <div class="checkout-form">
            <h2>Delivery Details</h2>
            <form id="checkout-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="full-name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" required>
                </div>
                <div class="form-group">
                    <label>Delivery Address</label>
                    <input type="text" id="address" required>
                </div>
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="city" required>
                </div>
            </form>
        </div>

        <div class="checkout-summary">
            <h3>Order Summary</h3>
            <div id="summary-items"></div>
            <div class="summary-total">
                <span>Total:</span>
                <span id="final-total">₦0</span>
            </div>
            <button class="pay-btn" onclick="processPayment()">PAY NOW (DEMO)</button>
        </div>
    </div>

    <script>
        let cartTotal = 0;

        fetch('/api/cart')
            .then(res => res.json())
            .then(data => {
                const summaryContainer = document.getElementById('summary-items');
                summaryContainer.innerHTML = '';
                
                if(data.length === 0) {
                    summaryContainer.innerHTML = '<p style="color:#888;">Your cart is empty.</p>';
                    return;
                }

                data.forEach(item => {
                    cartTotal += (item.price * item.quantity);
                    summaryContainer.innerHTML += `
                        <div class="summary-item">
                            <span>${item.product_name} (${item.size}) x${item.quantity}</span>
                            <span>₦${(item.price * item.quantity).toLocaleString()}</span>
                        </div>
                    `;
                });

                document.getElementById('final-total').innerText = `₦${cartTotal.toLocaleString()}`;
            });

        function processPayment() {
            const name = document.getElementById('full-name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            
            if (!name || !email || !phone || !address) {
                alert('Please fill in all delivery details.');
                return;
            }

            const btn = document.querySelector('.pay-btn');
            btn.innerText = 'PROCESSING PAYMENT...';
            btn.style.opacity = '0.7';

            // Send order to backend
            fetch('/api/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ customer_name: name, total: cartTotal })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = `success.html?total=${cartTotal}`;
                } else {
                    alert('Payment failed');
                    btn.innerText = 'PAY NOW (DEMO)';
                    btn.style.opacity = '1';
                }
            });
        }
    </script>
</body>
</html>
