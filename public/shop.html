<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | NOIRFRAME</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #333333;
            --white: #ffffff;
            --bone: #e8e4d9;
            --gray: #444444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--black); color: var(--white); font-family: 'Montserrat', sans-serif; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 30px 60px; }
        .logo-text { font-size: 28px; font-weight: 800; letter-spacing: 8px; color: var(--bone); text-decoration: none; }
        .nav-links { display: flex; gap: 40px; }
        .nav-links a { color: var(--bone); text-decoration: none; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; transition: 0.3s; }
        .nav-links a:hover { color: var(--white); }
        
        /* Hamburger Menu Icon */
        .menu-toggle { display: none; font-size: 30px; color: var(--bone); cursor: pointer; }

        .shop-header { text-align: center; padding: 40px 20px 40px; }
        .shop-header h1 { font-family: 'Playfair Display', serif; font-size: 4rem; font-weight: 400; }
        
        .filters { display: flex; justify-content: center; gap: 20px; margin-bottom: 60px; flex-wrap: wrap; }
        .filter-btn {
            padding: 12px 30px;
            background-color: transparent;
            color: var(--white);
            border: 1px solid #777;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 12px;
            transition: 0.3s;
        }
        .filter-btn:hover, .filter-btn.active {
            border-color: var(--white);
            background-color: var(--white);
            color: var(--black);
        }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px; padding: 0 50px 100px; }
        .product-card { background-color: var(--gray); border-radius: 4px; overflow: hidden; transition: transform 0.4s ease; }
        .product-card:hover { transform: translateY(-8px); }
        .product-image { width: 100%; height: 350px; object-fit: cover; border-bottom: 1px solid #555; }
        .product-info { padding: 25px 20px; text-align: center; }
        .product-name { font-size: 1rem; font-weight: 600; margin-bottom: 8px; letter-spacing: 1px; }
        .product-price { color: var(--gold); font-weight: 800; font-size: 1.1rem; margin-bottom: 20px; }
        .btn-small { padding: 10px 25px; font-size: 11px; background-color: transparent; color: var(--white); border: 1px solid #aaa; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; display: inline-block; }
        .btn-small:hover { border-color: var(--white); background-color: var(--white); color: var(--black); }

        /* --- MOBILE RESPONSIVENESS & HAMBURGER MENU --- */
        @media (max-width: 768px) {
            nav { flex-direction: row; justify-content: space-between; padding: 20px; position: relative; }
            .menu-toggle { display: block; }
            
            /* Dropdown Menu */
            .nav-links {
                display: none; 
                flex-direction: column;
                width: 100%;
                position: absolute;
                top: 100%;
                left: 0;
                background-color: var(--black);
                padding: 20px;
                gap: 20px;
                text-align: center;
                border-bottom: 1px solid #555;
                z-index: 1000;
            }
            .nav-links.active { display: flex; }
            .nav-links a { margin-left: 0; font-size: 14px; }

            .shop-header { padding: 20px 20px; }
            .shop-header h1 { font-size: 2.5rem; }
            .filters { gap: 10px; margin-bottom: 30px; }
            .filter-btn { padding: 10px 15px; font-size: 10px; }
            
            /* 2 Columns on Mobile */
            .product-grid { 
                grid-template-columns: repeat(2, 1fr); 
                gap: 15px; 
                padding: 0 15px 50px;
            }
            .product-image { height: 220px; }
            .product-info { padding: 15px 5px; }
            .product-name { font-size: 12px; }
            .product-price { font-size: 14px; }
            .btn-small { padding: 8px 5px; font-size: 9px; width: 100%; }
        }
    </style>
</head>
<body>

    <nav>
        <div style="display: flex; align-items: center;">
            <img src="images/favicon.png" alt="NF Logo" style="height: 70px; width: auto;">
        </div>
        
        <!-- Hamburger Icon (Mobile) -->
        <div class="menu-toggle" id="mobile-menu">&#9776;</div>

        <!-- Navigation Links -->
        <div class="nav-links" id="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#shop">Collections</a>
            <a href="cart.html" id="nav-cart-count">Cart (0)</a>
        </div>
    </nav>

    <div class="shop-header">
        <h1>Shop Collection</h1>
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="filterProducts('All')">All</button>
        <button class="filter-btn" onclick="filterProducts('Tees')">Tops</button>
        <button class="filter-btn" onclick="filterProducts('Hoodies')">Hoodies</button>
        <button class="filter-btn" onclick="filterProducts('Bottoms')">Bottoms</button>
        <button class="filter-btn" onclick="filterProducts('Outerwear')">Outerwear</button>
    </div>

    <div class="product-grid" id="product-container"></div>

    <script>
        // Hamburger Menu Logic
        document.addEventListener("DOMContentLoaded", () => {
            const mobileMenu = document.getElementById('mobile-menu');
            const navLinks = document.getElementById('nav-links');
            if (mobileMenu && navLinks) {
                mobileMenu.addEventListener('click', () => {
                    navLinks.classList.toggle('active');
                });
            }
        });

        let allProducts = [];

        fetch('/api/products')
            .then(response => response.json())
            .then(products => {
                allProducts = products;
                displayProducts(allProducts, 'All');
            })
            .catch(error => console.error('Error loading products:', error));

        function displayProducts(productsToShow, currentCategory) {
            const container = document.getElementById('product-container');
            container.innerHTML = ''; 
            
            let finalProducts = [];
            const seen = new Set();

            productsToShow.forEach(product => {
                const uniqueKey = product.name + '-' + product.color;

                if (currentCategory === 'All') {
                    if (!seen.has(product.category)) {
                        finalProducts.push(product);
                        seen.add(product.category);
                    }
                } else {
                    if (!seen.has(uniqueKey)) {
                        finalProducts.push(product);
                        seen.add(uniqueKey);
                    }
                }
            });
            
            finalProducts.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.name}" class="product-image">
                    <div class="product-info">
                        <h3 class="product-name">${product.name} - ${product.color}</h3>
                        <p class="product-price">₦${product.price.toLocaleString()}</p>
                        <a href="product.html?name=${encodeURIComponent(product.name)}&from=shop" class="btn-small">Select Size</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterProducts(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'All') {
                displayProducts(allProducts, 'All');
            } else {
                const filtered = allProducts.filter(p => p.category === category);
                displayProducts(filtered, category);
            }
        }
        
        // Update cart count in nav
        fetch('/api/cart')
            .then(res => res.json())
            .then(cart => {
                let total = 0;
                cart.forEach(item => total += item.quantity);
                document.getElementById('nav-cart-count').innerText = `Cart (${total})`;
            });
    </script>
</body>
</html>
