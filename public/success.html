<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | NOIRFRAME</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root { --black: #050505; --white: #ffffff; --bone: #e8e4d9; --gold: #cba052; --gray: #151515; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--black); color: var(--white); font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }

        .success-box { max-width: 600px; padding: 40px; background: var(--gray); border-radius: 8px; border-top: 3px solid var(--gold); }
        .success-box h1 { font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 20px; }
        .success-box p { color: #aaa; line-height: 1.6; margin-bottom: 30px; }
        .order-number { font-size: 1.2rem; font-weight: 800; color: var(--gold); margin-bottom: 40px; display: block; letter-spacing: 2px; }
        
        .btn-return { padding: 15px 40px; background: var(--white); color: var(--black); text-decoration: none; font-weight: 800; letter-spacing: 2px; transition: 0.3s; display: inline-block; border-radius: 4px; }
        .btn-return:hover { background: var(--gold); color: var(--white); }
    </style>
</head>
<body>

    <div class="success-box">
        <h1>Thank You.</h1>
        <p>Your order has been successfully placed. We've sent a confirmation email to your inbox.</p>
        
        <span class="order-number" id="order-total">₦0</span>

        <p style="font-size: 12px; margin-bottom: 20px;">Order ID: #NF-<span id="random-id">0000</span></p>

       <a href="my-orders.html" class="btn-return" style="background-color: var(--gold); color: var(--black); margin-bottom: 15px;">VIEW MY ORDERS</a><br>
<a href="index.html" class="btn-return">CONTINUE SHOPPING</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const total = urlParams.get('total') || '0';
        
        document.getElementById('order-total').innerText = `Total Paid: ₦${Number(total).toLocaleString()}`;
        document.getElementById('random-id').innerText = Math.floor(1000 + Math.random() * 9000);
    </script>
</body>
</html>
