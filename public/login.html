<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account | NOIRFRAME</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400;0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root { --black: #050505; --white: #ffffff; --bone: #e8e4d9; --gold: #cba052; --gray: #151515; --border: #333; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--black); color: var(--white); font-family: 'Montserrat', sans-serif; display: flex; height: 100vh; overflow: hidden; }

        /* Left Side - Image */
        .image-side {
            flex: 1;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.8)), url('images/hero-black.jpg') center/cover no-repeat;
            display: flex;
            align-items: flex-end;
            padding: 60px;
        }
        .image-side h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 400;
            color: var(--bone);
            line-height: 1.1;
        }
        .image-side h1 span { color: var(--gold); font-style: italic; }

        /* Right Side - Form */
        .form-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px 10%;
            background-color: var(--black);
        }
        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
        }
        .logo-text { font-size: 24px; font-weight: 800; letter-spacing: 6px; color: var(--bone); text-decoration: none; }
        .back-link { color: #888; text-decoration: none; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; transition: 0.3s; }
        .back-link:hover { color: var(--white); }

        /* Toggle Buttons */
        .tabs { display: flex; gap: 30px; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .tab-btn {
            background: transparent;
            border: none;
            color: #666;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            padding-bottom: 15px;
            margin-bottom: -16px;
        }
        .tab-btn.active { color: var(--white); border-bottom: 2px solid var(--gold); }

        /* Forms */
        .form-container { display: none; }
        .form-container.active { display: block; animation: fadeIn 0.4s ease; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Updated Input Styling for the Eye Icon */
        .input-wrapper { position: relative; }
                .input-wrapper input {
            width: 100%;
            padding: 15px;
            padding-right: 45px; /* Space for the eye icon */
            background-color: #151515 !important; /* Forces dark background */
            border: 1px solid #333;
            color: #ffffff !important; /* Forces white text */
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            transition: 0.3s;
            font-size: 14px;
        }
        .input-wrapper input:focus { 
            outline: none; 
            border-color: #cba052 !important; 
        }
        .input-wrapper input:focus { outline: none; border-color: var(--gold); }
        
        .eye-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
            color: #888;
            user-select: none;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: var(--white);
            color: var(--black);
            border: none;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 4px;
            margin-top: 20px;
        }
        .submit-btn:hover { background: var(--gold); color: var(--white); }

        /* Mobile */
        @media (max-width: 900px) {
            .image-side { display: none; }
            .form-side { padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <!-- Left Side Image -->
    <div class="image-side">
        <h1>Elevate your <br><span>Lifestyle.</span></h1>
    </div>

    <!-- Right Side Form -->
    <div class="form-side">
        <div class="form-header">
            <div style="display: flex; align-items: center;">
    <img src="images/favicon.png" alt="NF Logo" style="height: 80px; width: auto;">
</div>
            <a href="index.html" class="back-link">&larr; Back to Store</a>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login', this)">SIGN IN</button>
            <button class="tab-btn" onclick="switchTab('register', this)">CREATE ACCOUNT</button>
        </div>

        <!-- LOGIN FORM -->
        <div id="login-form" class="form-container active">
            <form onsubmit="handleLogin(event)">
               <div class="form-group">
    <label>Email Address</label>
    <div class="input-wrapper">
        <input type="email" id="login-email" required>
    </div>
</div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="login-password" required>
                        <span class="eye-icon" onclick="togglePassword('login-password', this)">👁️</span>
                    </div>
                </div>
                <button type="submit" class="submit-btn">SIGN IN</button>
            </form>
        </div>

        <!-- REGISTER FORM -->
        <div id="register-form" class="form-container">
            <form onsubmit="handleRegister(event)">
                                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="reg-name" required>
                    </div>
                </div>
                               <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="reg-email" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="reg-password" required minlength="6">
                        <span class="eye-icon" onclick="togglePassword('reg-password', this)">👁️</span>
                    </div>
                </div>
                <button type="submit" class="submit-btn">CREATE ACCOUNT</button>
            </form>
        </div>
    </div>

        <script>
        // Switch Tabs
        function switchTab(tabName, btn) {
            document.querySelectorAll('.form-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabName + '-form').classList.add('active');
            btn.classList.add('active');
        }

        // Toggle Password Visibility
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = '🙈'; 
            } else {
                input.type = 'password';
                icon.innerText = '👁️'; 
            }
        }

        // Handle Registration
        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('Account created successfully! You can now sign in.');
                    switchTab('login', document.querySelectorAll('.tab-btn')[0]);
                    document.getElementById('reg-name').value = '';
                    document.getElementById('reg-email').value = '';
                    document.getElementById('reg-password').value = '';
                } else {
                    alert(data.message);
                }
            });
        }

        // Handle Login (Clean, No Welcome Popup)
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // Save user silently and redirect
                    localStorage.setItem('noirframe_user', JSON.stringify(data.user));
                    window.location.href = 'index.html'; 
                } else {
                    // Only alert if login fails
                    alert(data.message);
                }
            });
        }
    </script>
</body>
</html>
